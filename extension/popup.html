<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <style>
    /* ── 设计 token（与主应用 index.css 保持一致，改配色只需改这里）── */
    :root {
      --background:       #FAFAFA;
      --foreground:       #262626;
      --muted-foreground: #8C8C8C;
      --border:           #E8E8E8;
      --primary:          #333333;
      --primary-fg:       #ffffff;
      --destructive:      #dc2626;
      --radius:           6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: var(--foreground);
      background: var(--background);
    }

    .header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 11px; color: var(--muted-foreground); font-weight: 500; }
    .field input,
    .field select,
    .field textarea {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 8px;
      font-size: 13px;
      outline: none;
      width: 100%;
      color: var(--foreground);
      background: #fff;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus { border-color: var(--primary); }
    .field textarea { resize: none; height: 56px; }

    .url-text {
      font-size: 11px;
      color: var(--muted-foreground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 4px 0;
    }

    .btn {
      background: var(--primary);
      color: var(--primary-fg);
      border: none;
      border-radius: var(--radius);
      padding: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      margin-top: 2px;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .success {
      padding: 24px 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .success .icon { font-size: 28px; }
    .success .msg { font-weight: 600; }
    .success a {
      color: var(--primary);
      font-size: 12px;
      text-decoration: none;
    }

    .loading {
      padding: 24px 14px;
      text-align: center;
      color: var(--muted-foreground);
    }

    .error-msg { font-size: 11px; color: var(--destructive); }
  </style>
</head>
<body>
  <div class="header">
    <svg width="22" height="22" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="28" height="28" rx="7" fill="#EF4444"/><g transform="translate(4,4) scale(0.833)"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#8B5CF6"/></g></svg>
    Pocket Brain
  </div>

  <div id="loading" class="loading">加载中...</div>

  <div id="form-view" class="form" style="display:none">
    <div class="field">
      <label>标题</label>
      <input type="text" id="title" />
    </div>
    <div class="field">
      <label>链接</label>
      <div class="url-text" id="url-display"></div>
    </div>
    <div class="field">
      <label>类型</label>
      <select id="type">
        <option value="article">文章</option>
        <option value="video">视频</option>
        <option value="audio">音频</option>
        <option value="tweet">帖子</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div class="field">
      <label>文件夹</label>
      <select id="folder"></select>
    </div>
    <div class="field">
      <label>备注（可选）</label>
      <textarea id="note" placeholder="添加备注..."></textarea>
    </div>
    <div id="error-msg" class="error-msg" style="display:none"></div>
    <button class="btn" id="save-btn">保存</button>
  </div>

  <div id="success-view" class="success" style="display:none">
    <div class="icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" fill="#059669"/>
        <polyline points="7 13 10.5 16.5 17 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="msg">已保存</div>
    <a href="https://pocket-brain-blush.vercel.app" target="_blank">在 Pocket Brain 中查看 →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
