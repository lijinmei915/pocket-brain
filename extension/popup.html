<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      min-height: 216px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: #262626;
      background: #FAFAFA;
      padding: 16px;
    }
    .panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #171717;
    }
    .subtitle {
      color: #737373;
      line-height: 1.4;
    }
    .group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .label {
      font-size: 12px;
      font-weight: 600;
      color: #525252;
    }
    .options {
      display: grid;
      gap: 8px;
    }
    .option {
      border: 1px solid #E5E5E5;
      background: #FFFFFF;
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .option:hover {
      border-color: #BDBDBD;
      background: #FCFCFC;
    }
    .option.active {
      border-color: #262626;
      background: #F5F5F5;
      box-shadow: inset 0 0 0 1px #262626;
    }
    .option-title {
      font-size: 13px;
      font-weight: 600;
      color: #171717;
    }
    .option-desc {
      margin-top: 4px;
      font-size: 12px;
      color: #737373;
      line-height: 1.35;
    }
    .current {
      font-size: 12px;
      color: #525252;
      background: #FFFFFF;
      border: 1px solid #EAEAEA;
      border-radius: 10px;
      padding: 8px 10px;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    .button {
      appearance: none;
      border: 1px solid #D4D4D4;
      border-radius: 10px;
      background: #FFFFFF;
      color: #171717;
      padding: 10px 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    .button:hover {
      background: #F5F5F5;
      border-color: #BDBDBD;
    }
    .button.primary {
      background: #171717;
      border-color: #171717;
      color: #FFFFFF;
      flex: 1;
    }
    .button.primary:hover {
      background: #262626;
      border-color: #262626;
    }
    .hint {
      font-size: 11px;
      color: #8C8C8C;
      line-height: 1.4;
    }
    .status {
      min-height: 18px;
      font-size: 11px;
      line-height: 1.4;
      color: #8C8C8C;
    }
    .status.error {
      color: #C2410C;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div>
      <div class="title">Pocket Brain</div>
      <div class="subtitle">手动选择入口环境，不再自动切换。</div>
    </div>

    <div class="group">
      <div class="label">当前环境</div>
      <div class="current" id="current-env">加载中…</div>
    </div>

    <div class="group">
      <div class="label">选择入口</div>
      <div class="options" id="env-options"></div>
    </div>

    <div class="actions">
      <button class="button" id="reload-btn" type="button">刷新选项</button>
      <button class="button primary" id="open-btn" type="button">打开保存页</button>
    </div>

    <div class="status" id="status-text"></div>
    <div class="hint">本地 AI 联调通常用 3000，只看前端页面可用 5173。</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
